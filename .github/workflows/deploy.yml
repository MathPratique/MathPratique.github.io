name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          # La même version que le poste de développement, où `npm test` et
          # `npm run build` sont vérifiés avant chaque poussée. Node 20 est en
          # fin de vie depuis avril 2026, et il ne sait pas développer le
          # motif « tests/**/*.test.mjs » que `npm test` passe à `node --test`.
          # (Sans lien avec la runtime des Cloud Functions, fixée à part dans
          # firebase.json.)
          node-version: "24"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        # Avant la construction, et bloquant : un test en échec arrête le
        # workflow, et le job de déploiement, qui dépend de celui-ci, ne
        # part pas. C'est ce qui manquait le 2026-09-05 : trois ajouts
        # d'exercices ont rendu faux les compteurs affichés sur le site, les
        # tests le signalaient, et la mise en ligne s'est faite quand même.
        run: npm test

      - name: Construire le site
        # Les 6 clés Firebase côté client sont injectées ici. Sans elles,
        # `firebaseEstConfigure` reste faux au build et l'onglet Connexion
        # ne s'affiche pas — c'était l'état voulu avant l'ouverture des
        # comptes. Ces valeurs ne sont pas des secrets : elles partent dans
        # le bundle, c'est le fonctionnement normal d'un client Firebase.
        # On les passe par `secrets` seulement pour éviter de les
        # versionner dans ce fichier. Ce qui protège les données, ce sont
        # firestore.rules et les vérifications côté Cloud Functions.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Copier index.html en 404.html pour le routage SPA
        run: cp dist/index.html dist/404.html

      - name: Créer le fichier CNAME pour le domaine personnalisé
        run: echo "mathpratique.ca" > dist/CNAME

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Transition vers Firebase Hosting (plan du 2026-10-20, étape 4). Le même
  # site part aussi sur Firebase, à l'adresse mathpratique-8dea1.web.app ;
  # mathpratique.ca reste servi par GitHub Pages jusqu'à la bascule du DNS.
  #
  # - Job séparé : un échec côté Firebase ne bloque pas GitHub Pages.
  # - Aucune nouvelle construction : on publie l'artefact exact du job
  #   `build`, déjà testé, pour que les deux hébergeurs servent les mêmes
  #   fichiers.
  # - Le site seulement : pour le canal `live`, l'action lance
  #   `firebase deploy --only hosting`. Les fonctions ne sont jamais
  #   touchées (analyserNotes est dans main sans être déployée).
  # - Le compte de service `github-deploiement-site` n'a que les rôles
  #   Administrateur Firebase Hosting et Lecteur de clés API.
  deploy-firebase:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code (pour firebase.json)
        uses: actions/checkout@v4

      - name: Récupérer le site construit par le job build
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./artefact

      - name: Extraire le site dans dist/
        # CNAME ne sert qu'à GitHub Pages : on ne le publie pas sur Firebase.
        run: |
          mkdir -p dist
          tar -xf artefact/artifact.tar -C dist
          rm -f dist/CNAME
          test -f dist/index.html
          test -f dist/404.html

      - name: Déployer sur Firebase Hosting (site seulement)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mathpratique-8dea1
          channelId: live
